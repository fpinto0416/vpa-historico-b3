[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vpa-b3"
version = "0.1.0"
description = "Histórico trimestral de VPA (CVM) e backtest de P/VPA vs média histórica para ações da B3"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2", "pyarrow>=15", "httpx>=0.27", "yfinance>=0.2.50",
  "matplotlib>=3.8", "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
pdf = ["playwright>=1.45"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 115
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]
